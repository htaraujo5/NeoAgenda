name: CI - Build & Test Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (.NET 8 Build & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify .NET Version
        run: dotnet --version

      - name: Restore Backend Dependencies
        run: dotnet restore backend/NeoAgenda.sln

      - name: Build Backend Solution
        run: dotnet build backend/NeoAgenda.sln --configuration Release --no-restore

      - name: Run Automated Tests
        run: dotnet test backend/NeoAgenda.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Publish Test Summary
        if: always()
        run: |
          echo "### 🧪 Backend Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "Suíte de testes automatizados (.NET 8 com xUnit, FluentAssertions e SQLite in-memory) executada com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "- **Projetos Testados:** NeoAgenda.UnitTests, NeoAgenda.IntegrationTests" >> $GITHUB_STEP_SUMMARY
          echo "- **Regras Cobertas:** RN01 (Telefone Canônico), RN02 (Importação CSV Resiliente), RN03 (Soft Delete 30 dias), RN04 (LGPD Purge)" >> $GITHUB_STEP_SUMMARY

  frontend-ci:
    name: Frontend (Vue 3 Build & Checks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Frontend Exists
        id: check_frontend
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Frontend not yet scaffolded; skipping step."
          fi

      - name: Setup Node.js 22
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Frontend Automated Tests
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm test

      - name: Type Check & Build Frontend
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

      - name: Publish Frontend Test Summary
        if: always() && steps.check_frontend.outputs.exists == 'true'
        run: |
          echo "### 🎨 Frontend Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "Suíte de testes do frontend (Vue 3 com Vitest, Vue Test Utils e Pinia) executada com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "- **Componentes e Stores Testados:** contactStore, client.ts (RFC 7807), LgpdConfirmDialog" >> $GITHUB_STEP_SUMMARY
